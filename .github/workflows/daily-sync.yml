name: Daily ownership sync

# Scrapes the Bellhaven website, compares it with the CRM and reports what needs review.
# This job only ever READS the CRM. Writes happen in the review app, one approved proposal at a time.

on:
  schedule:
    - cron: "0 11 * * *"      # every day at 11:00 UTC (06:00 or 07:00 US Eastern), ahead of the sales day
  workflow_dispatch: {}        # manual run from the Actions tab

concurrency:
  group: ownership-sync        # never two runs at the same time
  cancel-in-progress: false

permissions:
  contents: read               # the job changes nothing: not the CRM, not the repository

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # data/state.db in the repository is the ledger of decisions, committed by the reviewer after a
      # review session (the review app is its only writer). The run reads it, so anything already
      # approved or rejected is not proposed again; "new" in the summary is what is waiting for review.
      # The job exits non-zero, proposing nothing, if the scrape looks incomplete or the CRM is unreachable.
      - name: Scrape, match, report
        shell: bash               # bash here means -eo pipefail, so a failed run fails the job
        env:
          CRM_API_TOKEN: ${{ secrets.CRM_API_TOKEN }}
        run: python -m ownership_sync run | tee -a "$GITHUB_STEP_SUMMARY"
